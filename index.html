<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gimnàs</title>
  <meta name="description" content="Pla d'entrenament de gimnàs: sèries, pesos i historial.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <nav class="tabs" aria-label="Pantalles">
        <button type="button" data-screen="train" aria-current="page">Entrenar</button>
        <button type="button" data-screen="calendar">Calendari</button>
        <button type="button" data-screen="stats">Progrés</button>
        <button type="button" data-screen="history">Historial</button>
      </nav>
      <div class="days" id="days" role="group" aria-label="Dia del pla"></div>
    </div>
  </header>

  <main class="wrap">
    <section id="train" class="screen" aria-label="Entrenar"></section>
    <section id="calendar" class="screen" aria-label="Calendari" hidden></section>
    <section id="stats" class="screen" aria-label="Progrés" hidden></section>
    <section id="history" class="screen" aria-label="Historial" hidden></section>
  </main>

  <footer class="progress" id="progress">
    <div class="wrap">
      <div class="timer" id="timer" hidden>
        <div class="timer-main">
          <span class="timer-label" id="timer-label">Descans</span>
          <b class="timer-time tabular" id="timer-time" aria-live="off">0:00</b>
        </div>
        <div class="timer-btns">
          <button type="button" class="ghost" data-timer="-15" aria-label="Treu 15 segons">−15</button>
          <button type="button" class="ghost" data-timer="15" aria-label="Afegeix 15 segons">+15</button>
          <button type="button" class="ghost" data-timer="stop">Salta</button>
        </div>
        <div class="timer-bar"><span id="timer-fill"></span></div>
      </div>
      <div class="progress-text" aria-live="polite"><span id="progress-label"></span><span id="progress-pct"></span></div>
      <div class="bar"><span id="progress-fill"></span></div>
    </div>
  </footer>

  <dialog id="lightbox" aria-label="Foto de la màquina">
    <img alt="">
    <p></p>
    <button type="button" class="ghost">Tanca</button>
  </dialog>

  <script src="plan.js"></script>
  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
