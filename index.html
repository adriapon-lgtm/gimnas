<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gimnàs</title>
  <meta name="description" content="Pla d'entrenament de gimnàs: sèries, pesos i historial.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="topbar">
        <span class="brand">Gimnàs</span>
        <h1 class="screen-title" id="screen-title">Entrenar</h1>
      </div>
      <div class="days" id="days" role="group" aria-label="Dia del pla"></div>
    </div>
  </header>

  <main class="wrap">
    <section id="train" class="screen" aria-label="Entrenar"></section>
    <section id="calendar" class="screen" aria-label="Calendari" hidden></section>
    <section id="stats" class="screen" aria-label="Progrés" hidden></section>
    <section id="history" class="screen" aria-label="Historial" hidden></section>
  </main>

  <div class="timer" id="timer" hidden>
    <div class="timer-main">
      <span class="timer-label" id="timer-label">Descans</span>
      <b class="timer-time tabular" id="timer-time" aria-live="off">0:00</b>
    </div>
    <div class="timer-btns">
      <button type="button" data-timer="-15" aria-label="Treu 15 segons">−15</button>
      <button type="button" data-timer="15" aria-label="Afegeix 15 segons">+15</button>
      <button type="button" class="skip" data-timer="stop">Salta</button>
    </div>
    <div class="timer-bar"><span id="timer-fill"></span></div>
  </div>

  <nav class="nav" aria-label="Pantalles">
    <button type="button" data-screen="train" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg>
      <span>Entrenar</span>
    </button>
    <button type="button" data-screen="calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>Calendari</span>
    </button>
    <button type="button" data-screen="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M22 20H2"/></svg>
      <span>Progrés</span>
    </button>
    <button type="button" data-screen="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Historial</span>
    </button>
  </nav>

  <dialog id="lightbox" aria-label="Foto de la màquina">
    <img alt="">
    <p></p>
    <button type="button" class="ghost">Tanca</button>
  </dialog>

  <script src="plan.js"></script>
  <script src="muscles.js"></script>
  <script src="anim.js"></script>
  <script src="app.js"></script>
</body>
</html>
